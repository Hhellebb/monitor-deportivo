name: Morning Fetch (Monitor Deportivo)

on:
  schedule:
    # 14:00 UTC = 07:00 AM America/Mazatlan (UTC-7)
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      horizon_hours:
        description: "Ventana futura de partidos en horas"
        required: false
        default: "48"
        type: string

jobs:
  fetch_morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run unit tests
        run: python -m pytest -q pipeline/tests/test_pipeline.py

      - name: Run morning fetch & curation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          HORIZON_HOURS: ${{ inputs.horizon_hours || '48' }}
        run: python -m pipeline.fetch_morning --horizon-hours "$HORIZON_HOURS"
